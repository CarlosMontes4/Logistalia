<div class="flex justify-center items-center min-h-screen bg-gray-900 px-4">
  <form (ngSubmit)="login()" class="card w-full max-w-md bg-gray-800 rounded-lg shadow-lg p-10 space-y-6">
    <h2 class="text-3xl font-extrabold text-center text-orange-500 mb-6">Iniciar Sesión</h2>

    <input
      type="email"
      [(ngModel)]="correo"
      name="correo"
      placeholder="Correo electrónico"
      class="input input-bordered w-full border-orange-500 bg-gray-900 text-white placeholder-orange-400 focus:border-orange-400 focus:ring-2 focus:ring-orange-500 transition"
      required
      autocomplete="email" />

    <input
      type="password"
      [(ngModel)]="contrasena"
      name="contraseña"
      placeholder="Contraseña"
      class="input input-bordered w-full border-orange-500 bg-gray-900 text-white placeholder-orange-400 focus:border-orange-400 focus:ring-2 focus:ring-orange-500 transition"
      required
      autocomplete="current-password" />

    <button
      type="submit"
      class="btn bg-orange-600 hover:bg-orange-700 text-white font-semibold w-full transition-shadow shadow-md hover:shadow-lg">
      Entrar
    </button>

    <p class="text-center text-sm text-orange-400">
      ¿No tienes cuenta?
      <a href="/register" class="font-semibold underline hover:text-orange-500">Regístrate aquí</a>
    </p>
  </form>
</div>
