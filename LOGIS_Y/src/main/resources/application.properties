spring.application.name=logis_y
# Puerto del servidor
server.port=8080

# Configuración de base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/logistalia_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=alumno

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#Desactiva mensaje de clave generada por Spring Security
spring.jpa.open-in-view=false
